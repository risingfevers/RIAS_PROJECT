services:
  # --- Object Storage (аналог S3) ---
  minio:
    image: minio/minio:latest
    container_name: minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 3

  # --- Kafka-совместимый (Redpanda - актуальная версия) ---
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v23.3.4
    container_name: redpanda
    command:
      - redpanda
      - start
      - --smp 1
      - --memory 1G
      - --overprovisioned
      - --kafka-addr PLAINTEXT://0.0.0.0:9092,OUTSIDE://0.0.0.0:9093
      - --advertise-kafka-addr PLAINTEXT://redpanda:9092,OUTSIDE://localhost:9093
    ports:
      - "9093:9093"
      - "9644:9644"
    volumes:
      - redpanda_data:/var/lib/redpanda/data

  # --- Airflow с PostgreSQL ---
  postgres_airflow:
    image: postgres:13
    container_name: postgres_airflow
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow"]
      interval: 10s
      timeout: 5s
      retries: 5

  airflow_webserver:
    build: .
    container_name: airflow_webserver
    depends_on:
      postgres_airflow:
        condition: service_healthy
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres_airflow/airflow
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__WEBSERVER__RBAC: 'True'
      _AIRFLOW_WWW_USER_USERNAME: admin
      _AIRFLOW_WWW_USER_PASSWORD: admin
    volumes:
      - ./dags:/opt/airflow/dags
      - ./logs:/opt/airflow/logs
      - ./plugins:/opt/airflow/plugins
    ports:
      - "8080:8080"
    command: webserver
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  airflow_scheduler:
    build: .
    container_name: airflow_scheduler
    depends_on:
      postgres_airflow:
        condition: service_healthy
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres_airflow/airflow
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
    volumes:
      - ./dags:/opt/airflow/dags
      - ./logs:/opt/airflow/logs
      - ./plugins:/opt/airflow/plugins
    command: scheduler

  # Генератор событий (Real-time streaming)
  event-generator:
    build:
      context: .
      dockerfile: Dockerfile.streaming
    container_name: event-generator
    ports:
      - "8081:8081"  # HTTP API
      - "8765:8765"  # WebSocket
    environment:
      - PYTHONUNBUFFERED=1
    depends_on:
      - minio
    restart: unless-stopped

  # Grafana
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_INSTALL_PLUGINS=marcusolsson-json-datasource
    volumes:
      - ./provisioning:/etc/grafana/provisioning
      - grafana_data:/var/lib/grafana
    depends_on:
      - event-generator
    restart: unless-stopped

  # Cube.js - Semantic Layer
  cube:
    image: cubejs/cube:latest
    container_name: cube
    ports:
      - "4000:4000"
    environment:
      - CUBEJS_DB_TYPE=postgres
      - CUBEJS_DB_HOST=postgres_airflow
      - CUBEJS_DB_PORT=5432
      - CUBEJS_DB_NAME=airflow
      - CUBEJS_DB_USER=airflow
      - CUBEJS_DB_PASS=airflow
      - CUBEJS_WEB_SOCKETS=true
      - CUBEJS_API_SECRET=secret123456
    volumes:
      - ./cube/schema:/cube/conf/schema
    depends_on:
      - postgres_airflow
    restart: unless-stopped

  # PostgreSQL для хранения агрегатов Cube.js
  postgres_cube:
    image: postgres:13
    container_name: postgres_cube
    environment:
      - POSTGRES_USER=cube
      - POSTGRES_PASSWORD=cube123
      - POSTGRES_DB=cube
    volumes:
      - postgres_cube_data:/var/lib/postgresql/data
    restart: unless-stopped

  # Streamlit для веб-интерфейса
  streamlit:
    build:
      context: .
      dockerfile: Dockerfile.streamlit
    container_name: streamlit
    ports:
      - "8501:8501"
    environment:
      - CUBE_API_URL=http://cube:4000
      - CUBE_API_TOKEN=secret123456
    volumes:
      - ./streamlit:/app
    depends_on:
      - cube
    restart: unless-stopped

volumes:
  minio_data:
  redpanda_data:
  pg_data:
  postgres_cube_data:
  grafana_data:    # <--- ДОБАВЛЕНО